{% extends "base.html" %}
{% block title %}
Accident Statistics
{% endblock %}
{% block content %}
<h1>Accident Statistics</h1>
<div class="card">
    <h2>Accidents by Cause</h2>
    <img src="{{url_for('static',filename='bar_chart.png')}}"
    alt="Bar Chart showing accidents by cause">
</div>
<div class="card">
    <h2>Accident Severity Distribution</h2>
    <img src="{{url_for('static',filename='pie_chart.png')}}"
    alt="Pie Chart showing accident severity distribution">
</div>
<div class="card">
    <h2>Time of Day vs Number of Accidents</h2>
    <img src="{{url_for('static',filename='scatter_plot.png')}}"
    alt="Scatter plot showing time of day versus number of accidents">
</div>
{% endblock %}
